name: Build zorek apk
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Backend tests
        run: python tests/test_core.py

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # libziti.so (3 ABIs) takes ~20 min to build: only rebuild when the native recipe changes
      - name: Cache libziti
        id: libziti
        uses: actions/cache@v4
        with:
          path: native/out
          key: libziti-${{ hashFiles('native/Dockerfile', 'native/build_libziti.sh') }}

      - name: Build libziti for Android
        if: steps.libziti.outputs.cache-hit != 'true'
        run: |
          docker build -t zorek-native native
          mkdir -p native/out native/work
          docker run --rm -v "$PWD/native/work:/work" -v "$PWD/native/out:/out" zorek-native

      - name: Build APK
        run: bash ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: zorek-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
