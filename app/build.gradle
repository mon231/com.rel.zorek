plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

android {
    namespace 'com.rel.zorek'
    compileSdk 35

    defaultConfig {
        applicationId 'com.rel.zorek'
        minSdk 28
        targetSdk 35
        versionCode (findProperty('versionCode') ?: 1) as int
        versionName (findProperty('versionName') ?: '0.1')
        ndk { abiFilters "arm64-v8a", "armeabi-v7a", "x86_64" }
        python { version "3.11" }
    }

    sourceSets {
        main {
            python.srcDir "../backend"       // shared with desktop/app.py
            python.srcDir "../vendor"        // pure-python openziti (patched to find libziti.so)
            jniLibs.srcDir "../native/out"   // libziti.so per ABI, built by native/build_libziti.sh
        }
    }
    packaging { jniLibs { useLegacyPackaging = true } }  // extract libziti.so so dlopen-by-name finds it
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}
